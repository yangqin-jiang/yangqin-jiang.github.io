<!-- Icon set. Bump the ?v= value whenever the icons in images/ are regenerated so
     browsers that cached the old art fetch the new one. The .ico is declared from
     images/ because that is where the generator output lives; a copy also sits at
     the repo root for clients that probe /favicon.ico without reading this markup. -->
<link rel="icon" href="/images/favicon.ico?v=3" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png?v=3">
<link rel="manifest" href="/images/site.webmanifest?v=3">

<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="/images/mstile-144x144.png?v=3">
<meta name="msapplication-config" content="/images/browserconfig.xml?v=3">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
